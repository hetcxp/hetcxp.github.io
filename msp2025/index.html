<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSP Global Landscape 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <div class="header-top" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <h2>MSP Global 2025</h2>
                    <button id="mobile-menu-close" class="mobile-only">&times;</button>
                </div>
                <div class="lang-toggle-container" style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
                    <span class="lang-label">EN</span>
                    <label class="switch">
                        <input type="checkbox" id="lang-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="lang-label">ES</span>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar-wrapper">
                    <div id="global-progress" class="progress-fill"></div>
                </div>
                <span id="progress-text">0% Completed</span>
            </div>
            <ul id="module-list">
                <!-- Módulos inyectados vía JS -->
            </ul>
        </nav>
        
        <!-- Contenido Principal -->
        <main id="main-content">
            <header id="mobile-header" class="mobile-only">
                <button id="mobile-menu-btn">☰ Menu</button>
                <div class="mobile-progress">
                    <div id="mobile-progress-fill" class="progress-fill"></div>
                </div>
            </header>
            <div class="content-wrapper">
                <header id="module-header">
                    <div id="module-accent-bar"></div>
                    <h1 id="module-title">Loading...</h1>
                    <p id="module-objective" class="learning-objective"></p>
                </header>
                
                <div id="module-body">
                    <!-- Contenido del módulo inyectado vía JS -->
                </div>
                
                <footer id="module-footer">
                    <button id="next-module-btn" class="btn btn-primary">Next Module &rarr;</button>
                </footer>
            </div>
        </main>
        
        <!-- Glossary FAB -->
        <button id="glossary-fab" class="fab" title="Glossary">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </button>

        <!-- Glossary Modal -->
        <div id="glossary-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Glossary & Key Terms</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <input type="text" id="glossary-search" placeholder="Search terms...">
                <div id="glossary-list" class="glossary-list">
                    <!-- Terms injected via JS -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/data_en.js"></script>
    <script src="js/data_es.js"></script>
    <script src="js/components/radialHub.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
